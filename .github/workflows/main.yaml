name: Deno CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - created

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format code with deno fmt
        run: deno fmt

      - name: Commit and push changes if there are any
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          if ! git diff --cached --exit-code; then
            git commit -m "Auto-format code"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compile-non-windows:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile for Linux
        run: deno compile --bundle --minify --target x86_64-unknown-linux-gnu -o ./dist/auto-class-linux -A ./main.ts

      - name: Compile for macOS Arm
        run: deno compile --bundle --minify --target aarch64-apple-darwin -o ./dist/auto-class-macos-aarch64 -A ./main.ts

      - name: Compile for macOS Intel
        run: deno compile --bundle --minify --target x86_64-apple-darwin -o ./dist/auto-class-macos-x86_64 -A ./main.ts

      - name: Upload non-Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: non-windows-binaries
          path: |
            ./dist/auto-class-linux
            ./dist/auto-class-macos-*
          retention-days: 1

  compile-windows:
    runs-on: windows-latest
    needs: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile for Windows
        run: deno compile --bundle --minify --target x86_64-pc-windows-msvc -o ./dist/auto-class-windows.exe -A ./main.ts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: ./dist/auto-class-windows.exe
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [compile-non-windows, compile-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate version number
        run: |
          VERSION=$(date +'%Y%m%d%H%M%S')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Git tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag "v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          files: |
            ./dist/auto-class-linux
            ./dist/auto-class-macos-*
            ./dist/auto-class-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
